name: chirp

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chirp}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
  MEDIA_DIR: /data/media

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chirp}
      POSTGRES_USER: ${POSTGRES_USER:-chirp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations once, then exits. The API waits for it.
  migrate:
    build: ./backend
    image: chirp-backend:latest
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: chirp-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - media:/data/media
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: chirp-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${HTTP_PORT:-8080}:3000"
    networks: [internal, public]
    depends_on:
      backend:
        condition: service_healthy

networks:
  # The database and API are not reachable from outside Docker.
  internal:
    internal: true
  public: {}

volumes:
  pgdata:
  media:
